[versions]
agp = "9.1.1"
androidPdfViewer = "3.2.0-beta.3"
converterGson = "3.0.0"
coreKtx = "1.18.0"
coreSplashscreen = "1.2.0"
credentials = "1.7.0-alpha02"
credentialsPlayServicesAuth = "1.7.0-alpha02"
googleid = "1.2.0"
hiltAndroid = "2.59.2"
hiltCompiler = "2.59.2"
hiltLifecycleViewmodelCompose = "1.3.0"
hiltNavigationCompose = "1.3.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
